# Pruebas en cada push / pull request: pipeline (pytest), sintaxis JS y armado del sitio demo.
name: CI

on:
  push:
    branches-ignore: [data]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r pipeline/requirements-dev.txt
      - name: Pruebas del pipeline
        run: python -m pytest -q pipeline/tests
      - name: Sintaxis de la app
        run: node --check app/assets/js/app.js && node --check app/assets/js/config.js
      - name: Sitio de demostración
        run: |
          python scripts/demo_data.py --out demo_datos
          python -m rdm --data demo_datos build-site --out _site
          test -s _site/data/incidents/live.json && test -s _site/data/works/current.json
